name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Owner details come from repository variables. The fallback is clearly fake
      # and exists only so CI can run on forks and before the variables are set.
      # The deploy workflow has no fallback on purpose.
      PUBLIC_OWNER_NAME: ${{ vars.PUBLIC_OWNER_NAME || 'CI Test Owner' }}
      PUBLIC_OWNER_EMAIL: ${{ vars.PUBLIC_OWNER_EMAIL || 'ci-test@example.invalid' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Builds the site again with fixed test values, serves it and runs the browser tests.
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
