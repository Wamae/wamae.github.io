version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      # TypeScript 7 is not supported by typescript-eslint and @astrojs/check yet.
      # Remove this rule when they support it.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      eslint:
        patterns:
          - eslint
          - "@eslint/js"
          - typescript-eslint
      commitlint:
        patterns:
          - "@commitlint/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
