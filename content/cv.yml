# =============================================================================
# The content of the site: everything shown on About Me, Work Experience,
# Projects and Contact. This is the ONLY file to edit to change the site.
# Save it and push to main: the build checks it and the site is deployed.
# If something is wrong, the build stops and says which field and which line.
#
# FORMAT
#   - Lines starting with # are comments. Indent with spaces, never tabs.
#   - Text needs quotes ("..." or '...') when it starts with * & ! | > % @ # - ?
#     or [ { , or contains a colon followed by a space (: ) or a space followed by #.
#     Example: "**3X** more revenue" (it starts with a bold marker, so it needs quotes).
#   - Long text may continue on the next lines, indented more than its key.
#
# DATES (start and end of a role)
#   - A year ("2012") or a year and month ("2012-03", two digits for the month).
#   - end: null means the role is still going.
#   - Roles and projects are sorted newest first by the site: later end date first
#     (still going counts as newest), then later start date. Roles may overlap.
#   - Projects with the same dates (the projects of one role) show in the order
#     written in this file, so write them in the order you want.
#
# PROJECTS
#   - roleId must be the id of a role. A project shows the dates of its role. To give
#     a project its own dates add both start: and end: to it.
#   - Each project has exactly ONE industry, one of:
#       Fintech, Banking, Staffing, IoT, Public sector / data collection, Agriculture
#     ("Public sector / data collection" needs quotes). The Projects page lists an
#     industry only when it has a project.
#
# RESULTS: PERCENTAGES ONLY, NO CURRENCY
#   - Show revenue and similar results as percentages or multiples (80%, 3X).
#     Never write an amount of money: no currency sign or code (for example USD,
#     KES, Sh), no "/=" and no currency name (dollars, shillings, euros, pounds,
#     naira, rupees). The build fails if one is found.
#
# BOLD FIGURES
#   - Put ** on both sides of a figure to show it in bold: **80%**.
#   - Allowed in: summary, description, highlights and results. Not in titles,
#     names, skills or links.
#   - Bold is used for the impact figures (3X, 80%, 66%, 3 months, 3-4 weeks,
#     1000+, 100K, 10 million, 25%, 90%, 5, 100) and for the terms GDPR and COVID-19.
#   - No spaces just inside the markers, no nesting, no empty pairs, and no other
#     asterisks. A misplaced marker fails the build.
#
# LINKS (certification url and links below): https:// addresses only.
# Every id is lowercase words joined by hyphens and must be unique.
# =============================================================================

